{% extends 'aula_virtual/layout.html' %}
{% load i18n %}

{% block content %}
    {% if show_archive %}
            <iframe name="embed" src="{{ format.file.url }}#toolbar=0&navpanes=0"; width="100%" height="700px" marginwidth="0" marginheight="0" hspace="0" vspace="0" frameborder="0" scrolling="no"></iframe>
    {% else %}
            <video width="100%" height="500px" controls controlsList="nodownload">
              <source src="{{ format.file.url }}" type="video/mp4">
              <source src="{{ format.file.url }}" type="video/ogg">
              <source src="{{ format.file.url }}" type="video/webm">
              Your browser does not support the video tag.
            </video>

    {% endif %}

{% endblock %}
